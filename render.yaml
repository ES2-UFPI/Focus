databases:
  - name: focus-db
    plan: free
    databaseName: focus
    user: focus

services:
  - type: web
    name: focus-api
    runtime: python
    plan: free
    branch: dev
    autoDeploy: true
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn focus_api.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: focus-api-hqbc.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: focus-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"
