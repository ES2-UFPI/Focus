name: CI/CD - Test Run

on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - master
      - dev

jobs:
  backend-tests:
    name: Backend (Django) Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r backend/requirements.txt

      - name: Run Django Tests
        run: |
          cd backend
          python manage.py test

  frontend-tests:
    name: Frontend (Flutter) Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Run Flutter Analyze
        run: |
          cd frontend
          flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        run: |
          cd frontend
          flutter test

  deploy-frontend:
    name: Deploy Frontend (GitHub Pages)
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Flutter Web
        run: |
          cd frontend
          flutter build web --release --base-href /Focus/ --dart-define=FOCUS_API_BASE_URL=${{ secrets.FOCUS_API_BASE_URL }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/build/web